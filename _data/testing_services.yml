      - "测试电压、频率、波形和数据处理方式以双方确认的测试方案为准。"

workflow:
  - title: "1. Email Request"
    text: "Submit sample information, expected test items, required conditions, and contact details."
  - title: "2. Feasibility Review"
    text: "The group reviews instrument capability, safety boundary, sample compatibility, and schedule."
  - title: "3. Quote and Approval"
    text: "The service plan, data deliverables, timeline, and fees are confirmed according to approved university rules."
  - title: "4. Testing and Delivery"
    text: "Samples are delivered or tested on site; raw data, test conditions, and agreed results are returned."

request_fields:
  - "Applicant name, affiliation, research group/advisor, email, and phone number."
  - "Sample type, structure, quantity, size, electrode layout, and packaging form."
  - "Expected test items and conditions, including voltage, current, temperature, illumination wavelength, and frequency range."
  - "Required deliverables: raw data, plotted figures, or formal test report."
  - "Confidentiality, hazardous sample, contamination, or special operating requirements."

charging:
  summary: "Testing service fees follow the approved open-sharing testing service standards of the university or school. The final fee depends on test items, sample quantity, test conditions, instrument time, consumables, data processing, and report requirements."
  items:
    - name: "Instrument time"
      basis: "Instrument operation, maintenance, depreciation, site, and utility costs."
    - name: "Technical service"
      basis: "Operator time, test-plan design, test complexity, and data-quality review."
    - name: "Consumables"
      basis: "Probe tips, fixtures, conductive paste, sample holders, and special consumables."
    - name: "Report preparation"
      basis: "Formal signed/stamped report, English report, or additional figure/data processing if approved."

notice:
  - "High-voltage, high-current, temperature-dependent, and optical testing may cause device breakdown or sample failure."
  - "The group does not accept illegal, confidential, hazardous, corrosive, or contamination-prone samples unless the responsible platform has completed the required safety and compliance review."
  - "Payment, invoicing, contracts, and revenue management should follow the university or school procedures. Personal collection of service fees is not recommended."
