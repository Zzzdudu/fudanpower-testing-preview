    intro:
      - "适用于半导体器件精密电学参数测试，重点用于低电流、低泄漏和高灵敏度 I-V 表征。"
      - "预约时建议说明器件结构、测试端口、电流量级、扫描范围、步进方式和数据格式要求。"
    specifications:
