      - "N1272 电容测试模块：1 kHz-1 MHz C-V 测试。"
      - "变温探针台：室温至 150℃，托盘可加压，可测垂直器件。"
      - "光电测试光源：254 nm、310 nm、350 nm、380 nm。"

